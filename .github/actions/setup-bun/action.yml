name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    # Windows 跳过 bun pm 缓存的恢复/保存：actions/cache 的 tar+zstd 在 NTFS 上解压
    # 634MB 实测 ~209s，比 bun 原生 extract-to-cache(~168s)更慢，且 save 竞争失败再浪费
    # ~43s（bun.lock 每次提交都变 → exact key 永不命中 → 5 个 Windows job 全部竞争 save）。
    # 冷安装(~224s, build-opencode Windows 实测) < 有缓存(304s)。与 build-opencode.yml
    # Windows job 跳过 composite 缓存的先例一致。macOS/Linux restore 仅 16-67s，保留缓存。
    - name: Get cache directory
      id: cache
      if: runner.os != 'Windows'
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Restore Bun dependencies
      id: bun-cache
      if: runner.os != 'Windows'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      env:
        # CI 无需 electron/playwright/puppeteer/cypress 的预构建二进制：
        # opencode/core/http-recorder 单测不依赖它们；upstream-e2e 的 playwright
        # 浏览器由 test.yml 的独立步骤安装（PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD 仅抑制
        # bun install 的 postinstall 自动下载，不影响后续 `playwright install` CLI）。
        # 与 build-opencode.yml 的 Windows install 步骤保持一致。
        # 注意：electron 的 install.js 实际检查 ELECTRON_SKIP_BINARY_DOWNLOAD（另一个
        # ELECTRON_SKIP_DOWNLOAD 供 electron-builder 等工具识别，两者都设以对齐先例）。
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        ELECTRON_SKIP_DOWNLOAD: "1"
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        PUPPETEER_SKIP_DOWNLOAD: "1"
        CYPRESS_INSTALL_BINARY: "0"
        # CI 不提交代码，无需 husky 安装 git hook；HUSKY=0 让 husky 9 直接 return（exit 0）。
        # 测试中的 git commit 均在 os.tmpdir() 的独立 repo 中执行，不读取根 .husky/，互不影响。
        HUSKY: "0"
      run: |
        # Workaround for patched peer variants
        # e.g. ./patches/ for standard-openapi
        # https://github.com/oven-sh/bun/issues/28147
        bun install --linker hoisted ${{ inputs.install-flags }}
      shell: bash

    - name: Save Bun dependencies
      # runner.os != 'Windows' 必须在最前短路：Windows 跳过了 restore(id=bun-cache)，
      # cache-hit 输出不存在；若不短路会以空 path 触发 cache/save。
      if: runner.os != 'Windows' && steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
