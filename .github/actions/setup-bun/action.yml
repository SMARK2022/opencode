name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # node-gyp@latest (invoked via bunx for native install scripts) requires Node >=22;
    # some runner images ship an older system Node on PATH
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"

    - name: Get Bun version and baseline download URL
      id: bun-url
      shell: bash
      run: |
        V=$(node -p "require('./package.json').packageManager.split('@')[1]")
        echo "version=$V" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_ARCH" = "X64" ]; then
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ !steps.bun-url.outputs.url && steps.bun-url.outputs.version || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Get cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Restore Bun dependencies
      id: bun-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      env:
        # CI 无需 electron/playwright/puppeteer/cypress 的预构建二进制：
        # opencode/core/http-recorder 单测不依赖它们；upstream-e2e 的 playwright
        # 浏览器由 test.yml 的独立步骤安装（PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD 仅抑制
        # bun install 的 postinstall 自动下载，不影响后续 `playwright install` CLI）。
        # 与 build-opencode.yml 的 Windows install 步骤保持一致。
        # 注意：electron 的 install.js 实际检查 ELECTRON_SKIP_BINARY_DOWNLOAD（另一个
        # ELECTRON_SKIP_DOWNLOAD 供 electron-builder 等工具识别，两者都设以对齐先例）。
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        ELECTRON_SKIP_DOWNLOAD: "1"
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        PUPPETEER_SKIP_DOWNLOAD: "1"
        CYPRESS_INSTALL_BINARY: "0"
        # CI 不提交代码，无需 husky 安装 git hook；HUSKY=0 让 husky 9 直接 return（exit 0）。
        # 测试中的 git commit 均在 os.tmpdir() 的独立 repo 中执行，不读取根 .husky/，互不影响。
        HUSKY: "0"
      # 统一 hoisted linker：全平台避免 patched peer 冲突
      run: bun install --linker hoisted ${{ inputs.install-flags }}
      shell: bash

    - name: Save Bun dependencies
      if: steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
