name: OpenTUI Windows diagnostic

on:
  push:
    branches:
      - diag/opentui-windows-crash
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
  OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

jobs:
  baseline:
    name: Windows two-process full suite ${{ matrix.attempt }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run two-process full suite
        run: |
          mkdir -p packages/opencode/.artifacts/unit
          files=()
          while IFS= read -r file; do
            files+=("${file#packages/opencode/}")
          done < <(git ls-files packages/opencode/test | grep -E '\.test\.tsx?$')

          core=()
          tui=()
          for file in "${files[@]}"; do
            case "$file" in
              test/cli/run/*|test/cli/tui/*|test/cli/cmd/tui/*) tui+=("$file") ;;
              *) core+=("$file") ;;
            esac
          done
          printf 'test shard coverage: total=%d core=%d tui=%d\n' "${#files[@]}" "${#core[@]}" "${#tui[@]}"

          core_status=0
          tui_status=0
          bun --cwd packages/opencode test "${core[@]}" \
            --timeout 30000 \
            --reporter=junit \
            --reporter-outfile=.artifacts/unit/core.xml || core_status=$?
          bun --cwd packages/opencode test "${tui[@]}" \
            --timeout 30000 \
            --reporter=junit \
            --reporter-outfile=.artifacts/unit/tui.xml || tui_status=$?
          printf 'test shard status: core=%d tui=%d\n' "$core_status" "$tui_status"
          if (( core_status != 0 || tui_status != 0 )); then exit 1; fi

      - name: Upload unit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opentui-windows-two-process-${{ matrix.attempt }}
          path: packages/opencode/.artifacts/unit/*.xml
          if-no-files-found: ignore
          retention-days: 3
