name: guard
# 机械门禁的 CI 侧：plan 根据改动决定测试平台和是否运行 A/B 基准。
#   pull_request      第三方 PR 不依赖本地 hook。用目标分支的规则与基线检查，保留审批和置顶评论。
#   workflow_dispatch 本地 pre-push 固定待推送的 SHA 和比较基准，在线上运行该计划。
#   push dev1-smark   规则与契约仍验证；相同输入已有成功 preflight 时，复用平台测试和基准结果。
#
# 产品全量测试由 test.yml 负责；覆盖率图、基准趋势与看板数据由 guard-nightly.yml 维护。

run-name: ${{ github.event_name == 'workflow_dispatch' && format('preflight base={0} · {1} · {2}', inputs.base, github.ref_name, inputs.platforms) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  pull_request:
    branches: [dev1-smark]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev1-smark]
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        options: [preflight]
        default: preflight
      platforms:
        description: "平台，逗号分隔：linux,macos,windows"
        default: "macos,linux"
      base:
        description: "本次选测的比较提交（完整 SHA，由 preflight 固定）"
        required: true
        type: string

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENCODE_DISABLE_LSP_DOWNLOAD: "true"

jobs:
  plan:
    name: 计划
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      base: ${{ steps.mode.outputs.base }}
      policy: ${{ steps.mode.outputs.policy }}
      runtime: ${{ steps.plan.outputs.runtime }}
      tests: ${{ steps.plan.outputs.tests }}
      bench: ${{ steps.plan.outputs.bench }}
      protected: ${{ steps.plan.outputs.protected }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: 判定模式与比较基准
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REQUESTED_BASE: ${{ inputs.base }}
        run: |
          case "$EVENT" in
            pull_request)
              echo "mode=pr" >> "$GITHUB_OUTPUT"
              policy=$(git rev-parse "origin/$BASE_REF")
              base=$(git merge-base "$policy" HEAD) ;;
            workflow_dispatch)
              echo "mode=preflight" >> "$GITHUB_OUTPUT"
              base=$(git rev-parse --verify "$REQUESTED_BASE^{commit}")
              policy=$base ;;
            push)
              echo "mode=push" >> "$GITHUB_OUTPUT"
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}"; then base="$BEFORE"; else base="HEAD~1"; fi
              policy=$base ;;
          esac
          echo "base=$(git rev-parse "$base")" >> "$GITHUB_OUTPUT"
          echo "policy=$(git rev-parse "$policy")" >> "$GITHUB_OUTPUT"
      - name: 改动分类
        id: plan
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          BASE: ${{ steps.mode.outputs.base }}
          POLICY: ${{ steps.mode.outputs.policy }}
          PLATFORMS: ${{ inputs.platforms }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=script/guard
          if [ "$MODE" = pr ]; then
            mkdir -p "$RUNNER_TEMP/policy"
            git archive "$POLICY" script/guard | tar -x -C "$RUNNER_TEMP/policy"
            dir="$RUNNER_TEMP/policy/script/guard"
          fi
          bun "$dir/ci.ts" plan --base "$BASE" --platforms "$PLATFORMS"

  rules:
    name: 规则与契约
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # 读取 PR 的 approve，用于放行超出改动规模的提交
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      # PR 用目标分支上的规则、基线与脚本：PR 自己改 script/guard 不能放宽对自己的检查
      - name: 准备规则来源
        id: src
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          POLICY: ${{ needs.plan.outputs.policy }}
        run: |
          dir="$GITHUB_WORKSPACE/script/guard"
          if [ "$MODE" = pr ]; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive "$POLICY" script/guard .github/workflows/guard.yml | tar -x -C "$RUNNER_TEMP/base"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
            dir="$RUNNER_TEMP/base/script/guard"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: 规则检查
        env:
          GUARD_TYPESCRIPT: ${{ github.workspace }}/node_modules/typescript
          MODE: ${{ needs.plan.outputs.mode }}
          BASE: ${{ needs.plan.outputs.base }}
          DIR: ${{ steps.src.outputs.dir }}
          PR: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [ "$MODE" = pr ]; then
            # PR 不认提交信息里的放行标记（第三方 Agent 可以随便写）；超出改动规模时，需要维护者 approve 后点 Re-run
            extra+=(--no-trailer)
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate --slurp > "$RUNNER_TEMP/guard-reviews.json"
            approved=$(jq --arg head "$PR_HEAD" \
              '[.[][] | select(.state != "COMMENTED")] | group_by(.user.id) | map(sort_by(.submitted_at) | last) | [.[] | select(.state == "APPROVED" and .commit_id == $head and (.author_association == "OWNER" or .author_association == "MEMBER"))] | length' \
              "$RUNNER_TEMP/guard-reviews.json")
            [ "${approved:-0}" -gt 0 ] && extra+=(--allow-large)
          elif git cat-file -e "$BASE:script/guard/baseline.json" 2>/dev/null; then
            git show "$BASE:script/guard/baseline.json" > "$RUNNER_TEMP/prev-baseline.json"
            extra+=(--previous-baseline "$RUNNER_TEMP/prev-baseline.json")
          fi
          bun "$DIR/check.ts" . --commit HEAD --changed-since "$BASE" --baseline "$DIR/baseline.json" "${extra[@]}" \
            --annotate --diff-base "$BASE" --json guard.json --markdown "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = pr ]; then
            bun "$DIR/check.ts" . --commit HEAD --changed-since "$BASE" \
              "${extra[@]}" --baseline script/guard/baseline.json --previous-baseline "$DIR/baseline.json" --quiet
          fi
      - name: 契约与打包边界测试
        if: success() || failure()
        env:
          GUARD_TYPESCRIPT: ${{ github.workspace }}/node_modules/typescript
          DIR: ${{ steps.src.outputs.dir }}
        run: bun "$DIR/gate.ts" contracts
      - name: 候选规则、自测与基线收紧
        if: (success() || failure()) && needs.plan.outputs.mode == 'pr' && needs.plan.outputs.protected == 'true'
        env:
          GUARD_TYPESCRIPT: ${{ github.workspace }}/node_modules/typescript
          DIR: ${{ steps.src.outputs.dir }}
        run: |
          bun run --cwd script/guard typecheck
          bun run --cwd script/guard test
          bun script/guard/check.ts . --commit HEAD --previous-baseline "$DIR/baseline.json" --quiet
      - name: 上传规则报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guard-report
          path: guard.json
          if-no-files-found: ignore
          retention-days: 14

  bench:
    name: 性能基准
    needs: plan
    if: needs.plan.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      # 基准脚本与预算同样取自目标分支：PR 不能改自己的考卷
      - name: 准备基准脚本
        id: src
        if: github.event_name == 'pull_request'
        env:
          POLICY: ${{ needs.plan.outputs.policy }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$POLICY" script/guard | tar -x -C "$RUNNER_TEMP/base"
          dir="$RUNNER_TEMP/base/script/guard"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: A/B 基准（head 对 merge-base）
        env:
          GUARD_TYPESCRIPT: ${{ github.workspace }}/node_modules/typescript
        run: |
          bun "${{ steps.src.outputs.dir || 'script/guard' }}/bench/opencode.ts" --head HEAD --base "${{ needs.plan.outputs.base }}" \
            --json bench.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: 上传基准结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-result
          path: bench.json
          if-no-files-found: ignore
          retention-days: 30

  comment:
    name: PR 评论
    needs: [plan, rules, bench]
    if: always() && needs.plan.outputs.mode == 'pr' && needs.rules.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # 只取目标分支的报告脚本，不执行 PR 里的任何代码（此任务持有写评论的权限）
      - name: 取目标分支的报告脚本
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.base_ref }}
          sparse-checkout: script/guard
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: 下载本次结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n guard-report -D in || true
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n bench-result -D in || true
      - name: 生成并更新置顶评论
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BENCH_RESULT: ${{ needs.bench.result }}
        run: |
          [ -f script/guard/report.ts ] || { echo "目标分支还没有 report.ts，跳过评论"; exit 0; }
          bench=()
          if [ -f in/bench.json ]; then bench=(--bench in/bench.json)
          elif [ "$BENCH_RESULT" = skipped ]; then bench=(--bench none)
          fi
          bun script/guard/report.ts comment --guard in/guard.json "${bench[@]}" --bench-status "$BENCH_RESULT" --out comment.md
          marker=$(head -1 comment.md)
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.user.type == \"Bot\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

  preflight:
    name: preflight / ${{ matrix.os }} / ${{ needs.plan.outputs.base }}
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GUARD_LOG_ARTIFACT: guard-logs-${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      # 测试优先使用 PATH 上的 rg；没有时每个测试进程都会去 GitHub 下载，网络抖动会被误判为测试失败
      - name: 准备 ripgrep
        run: |
          command -v rg >/dev/null && exit 0
          case "$RUNNER_OS" in
            Linux) sudo apt-get install -y -qq ripgrep ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep --yes --no-progress ;;
          esac
          rg --version
      # 平台任务只执行选测。规则和固定契约由上面的 rules 任务验证一次。
      - name: 规则 + 选中测试 + 契约（${{ matrix.os }}）
        id: gate
        env:
          GH_TOKEN: ${{ github.token }} # 只用来下载覆盖率图（release guard-coverage-map）
          GUARD_TYPESCRIPT: ${{ github.workspace }}/node_modules/typescript
        run: bun script/guard/gate.ts suites --since "${{ needs.plan.outputs.base }}"
      - name: 上传门禁失败日志
        if: failure() && steps.gate.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.GUARD_LOG_ARTIFACT }}
          path: .git/guard/logs/*.log
          include-hidden-files: true
          overwrite: true
          retention-days: 14

  result:
    name: guard-required
    needs: [plan, rules, bench, preflight]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 必需任务必须实际通过
        env:
          WANT_TESTS: ${{ needs.plan.outputs.tests }}
          PLAN: ${{ needs.plan.result }}
          RULES: ${{ needs.rules.result }}
          BENCH: ${{ needs.bench.result }}
          WANT_BENCH: ${{ needs.plan.outputs.bench }}
          PREFLIGHT: ${{ needs.preflight.result }}
        run: |
          [ "$PLAN" = success ]
          [ "$RULES" = success ]
          required() {
            case "$1/$2" in
              true/success|false/skipped) return 0 ;;
              *) return 1 ;;
            esac
          }
          required "$WANT_TESTS" "$PREFLIGHT"
          required "$WANT_BENCH" "$BENCH"

  cleanup:
    name: 删除 preflight 临时分支
    needs: [plan, preflight]
    if: always() && needs.plan.outputs.mode == 'preflight' && startsWith(github.ref_name, 'preflight/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || true
