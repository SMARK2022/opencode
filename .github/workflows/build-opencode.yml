name: Build OpenCode CLI

on:
  # workflow_dispatch 手动触发：版本号可选，缺省时使用 env.DEFAULT_VERSION
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.14.31-smark)'
        required: false
        type: string
  # push 自动触发：dev-smark 分支推送时自动构建，路径过滤避免无关变更触发 CI
  push:
    branches:
      - dev-smark
    paths:
      - ".github/workflows/build-opencode.yml"
      - "packages/opencode/**"
      # 原 CLI 产品已拆到这些运行时 owner，独立改动也须触发构建，避免仅旧目录命中而漏包
      - "packages/core/**"
      - "packages/tui/**"
      - "packages/llm/**"
      - "packages/schema/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "package.json"
      - "bun.lock"

# 默认版本号：push 触发时无 inputs.version，回退到此常量保证产物命名一致
env:
  DEFAULT_VERSION: "1.14.31-smark"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-bun 从根 packageManager 取 Bun 版本，并保留缓存及 Windows hoisted 安装分支
      - uses: ./.github/actions/setup-bun

      # build.ts 会清空 dist，三平台在各自 runner 执行构建，不能共享同一构建目录
      - name: Build Linux
        run: |
          cd packages/opencode
          # --skip-embed-web-ui 同时排除文件映射与 UI entrypoint，沿用上游 CLI-only 构建入口
          # dispatch 输入或 push 默认值交给 --version，version-env 先于 Script 求值以统一嵌入和打包版本
          bun run script/build.ts --version=${{ inputs.version || env.DEFAULT_VERSION }} --os=linux --skip-embed-web-ui

      - name: Package Linux tar.gz
        run: |
          cd packages/opencode/dist/opencode-linux-x64/bin
          # bin 位于 dist/<target>/bin，回退两级才与 upload-artifact 的 dist 路径一致
          tar -czf ../../opencode-linux-x64-${{ inputs.version || env.DEFAULT_VERSION }}.tar.gz opencode

      - name: Package Linux .deb
        # YAML 自动剥离公共缩进，control/EOF 顶格；Description 续行仍多一空格。
        run: |
          # Actions 先替换表达式，再由 shell 展开 VERSION，让 control 与 deb 文件名共享回退值
          VERSION="${{ inputs.version || env.DEFAULT_VERSION }}"
          DEB_DIR="/tmp/deb_build"
          PKG_NAME="opencode_${VERSION}_amd64"
          BINARY="packages/opencode/dist/opencode-linux-x64/bin/opencode"

          # 保留源包的 usr/local/bin 安装位置，control 必须放在包根的 DEBIAN 目录
          mkdir -p "${DEB_DIR}/${PKG_NAME}/DEBIAN"
          mkdir -p "${DEB_DIR}/${PKG_NAME}/usr/local/bin"

          cp "$BINARY" "${DEB_DIR}/${PKG_NAME}/usr/local/bin/opencode"
          # 复制后显式赋予执行位，避免归档或 runner 文件权限影响安装后的 CLI 启动
          chmod 755 "${DEB_DIR}/${PKG_NAME}/usr/local/bin/opencode"

          # Description 续行保留第十一空格，剥离公共缩进后仍是 Debian 必需的单空格续行
          # Linux deb 的 amd64 元数据只对应 x64 二进制，不能把 arm64 混入同一包
          cat > "${DEB_DIR}/${PKG_NAME}/DEBIAN/control" <<EOF
          Package: opencode
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: smark <smark@local>
          Description: opencode AI-powered development tool (smark build)
           A standalone AI coding assistant with TUI, version ${VERSION}.
          EOF

          dpkg-deb --build "${DEB_DIR}/${PKG_NAME}" "packages/opencode/dist/opencode_${VERSION}_amd64.deb"

      # Linux 仅上传源集合的 x64/amd64 产物，路径从仓库根定位 dist，不能漏包或扩张架构集合
      # glob 只放宽版本段，保留 x64/amd64 边界，避免误上传 Linux arm64 或目录内容
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-linux
          path: |
            packages/opencode/dist/opencode-linux-x64-*.tar.gz
            packages/opencode/dist/opencode_*_amd64.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Build macOS
        run: |
          cd packages/opencode
          # --os=darwin 选择双架构而非 runner 本机架构，不能替换为 --single
          bun run script/build.ts --version=${{ inputs.version || env.DEFAULT_VERSION }} --os=darwin --skip-embed-web-ui

      - name: Package macOS tar.gz
        run: |
          # VERSION shell 变量：统一两架构的命名，避免重复展开 GitHub 表达式
          VERSION="${{ inputs.version || env.DEFAULT_VERSION }}"
          # darwin 目标名来自 build.ts，保持原生目录名以匹配两架构打包路径
          cd packages/opencode/dist/opencode-darwin-arm64/bin
          tar -czf ../../opencode-darwin-arm64-${VERSION}.tar.gz opencode
          cd ../../opencode-darwin-x64/bin
          tar -czf ../../opencode-darwin-x64-${VERSION}.tar.gz opencode

      # macOS 保留源双架构产物集合，分别上传原生 darwin 目标目录生成的归档
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-macos
          path: |
            packages/opencode/dist/opencode-darwin-arm64-*.tar.gz
            packages/opencode/dist/opencode-darwin-x64-*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # setup-bun 已提供 Node 24；Python 必须先就绪，供其安装阶段的 node-gyp 使用
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MSBuild 先于 setup-bun 的依赖安装，保留 Windows 原生 addon 的编译工具链入口
      - uses: microsoft/setup-msbuild@v2

      - uses: ./.github/actions/setup-bun

      - name: Build Windows
        shell: pwsh
        run: |
          cd packages/opencode
          bun run script/build.ts --version=${{ inputs.version || env.DEFAULT_VERSION }} --os=win32 --skip-embed-web-ui

      - name: Package Windows zip
        shell: pwsh
        run: |
          # push 没有 version 输入，pwsh 也须先取同一回退值，否则双架构 zip 会丢失版本段
          $VERSION = "${{ inputs.version || env.DEFAULT_VERSION }}"
          # --os 使用 win32，而 build.ts 目录名转成 windows；pwsh 路径须沿此映射
          cd packages/opencode/dist/opencode-windows-x64/bin
          # Windows 编译生成 .exe；从 bin 回退两级写入 dist，保持双架构归档与上传一致
          Compress-Archive -Path "opencode.exe" -DestinationPath "../../opencode-windows-x64-$VERSION.zip"
          cd ../../opencode-windows-arm64/bin
          Compress-Archive -Path "opencode.exe" -DestinationPath "../../opencode-windows-arm64-$VERSION.zip"

      # Windows 保留源双架构 zip 集合，不把 runner 架构当作唯一发布架构
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-windows
          path: |
            packages/opencode/dist/opencode-windows-x64-*.zip
            packages/opencode/dist/opencode-windows-arm64-*.zip
