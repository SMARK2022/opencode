# #156：SMARK CLI 构建与 GitHub Release 工作流
name: Build OpenCode CLI

# #156：push dev-smark 与手动 workflow_dispatch
on:
  # #156：手动触发不依赖 push，可单独发布紧急修复版
  workflow_dispatch:
    inputs:
      # #156：inputs.version 非空才覆盖；空串与未传等同，避免 workflow 与包版本双源漂移
      version:
        # #156：显式版本允许 v 前缀，脚本内统一去 v 后再拼接 tag
        # #161：示例版本随 tip 升号；默认仍读 package.json
        # #253：source bump 1.15.3→1.15.4 按 0161 协同升号规则映射到目标版本线 1.19.12→1.19.13-smark
        # #253：README 的 SMARK 展示段在目标为纯上游未移植——版本展示语义由本文件与 package.json 承载
        description: "Override version, for example 1.19.13-smark. Empty means packages/opencode/package.json version."
        required: false
        type: string
  push:
    branches:
      - dev-smark
    paths:
      - ".github/workflows/build-opencode.yml"
      # #156：保留 tip setup-bun 路径触发，工具链变更必重建
      - ".github/actions/setup-bun/action.yml"
      - "packages/opencode/**"
      # 原 CLI 产品已拆到这些运行时 owner，独立改动也须触发构建，避免仅旧目录命中而漏包
      - "packages/core/**"
      # 构建依赖迁移后仍保留既有owner范围，并补齐源要求的SDK、插件及构建入口。
      - "packages/plugin/**"
      - "packages/script/**"
      - "packages/sdk/js/**"
      - "packages/ui/**"
      - "packages/tui/**"
      - "packages/llm/**"
      - "packages/schema/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "package.json"
      - "bun.lock"
      # #156：install 变更触发重建，保证 release 脚本同步
      - "install"

# #156：顶层 permissions 供 release 写权限
permissions:
  # #156：仅申请 contents:write：重试上传不需要 actions 写权限，最小权限原则
  contents: write

# #156：同 ref+version 串行且不 cancel 半成品 release
concurrency:
  group: build-opencode-${{ github.ref }}-${{ github.event.inputs.version || 'package-json' }}
  # #156：cancel-in-progress: false：被顶替的旧构建仍完成上传，避免 release 资产缺失
  cancel-in-progress: false

# #156：version→build-*→checksums 流水线
jobs:
  version:
    # #156：checksums 与 linux 同 runner：下载 artifact 无平台约束，省 macOS 配额
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      # #156：检出触发 ref：version 从 package.json 读默认号，build 用同源码
      - uses: actions/checkout@v4

      # #156：version/tag 作为 job 输出供 build 消费，避免各 job 重复解析造成版本不一致
      - id: pkg
        shell: bash
        run: |
          # #156：版本读取失败 fail-closed，禁止默认常量
          set -euo pipefail

          VERSION="${{ github.event.inputs.version || '' }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./packages/opencode/package.json').version")"
          fi

          VERSION="${VERSION#v}"

          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "Failed to resolve packages/opencode/package.json version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
          echo "Resolved tag: v$VERSION"

  # #156：mac 双架构构建与 codesign
  build-macos:
    # #156：needs 显式声明：version 失败时 build 不以空版本号产出错误资产
    needs: version
    # #156：单 job 双 target：共享 bun 缓存，比 matrix 拆分省一半 setup 时间
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # #156：composite action 单一来源：本地 workflow 与上游工具链升级自动同步
      - uses: ./.github/actions/setup-bun

      - name: Build macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          cd packages/opencode
          # #156：同一 build.ts 产三平台：构建参数差异只在一处维护
          bun run script/build.ts \
            --version=${{ needs.version.outputs.version }} \
            --os=darwin \
            --skip-embed-web-ui

      - name: Sign and package macOS assets
        shell: bash
        run: |
          set -euo pipefail

          DIST="packages/opencode/dist"
          ASSETS="release-assets"
          mkdir -p "$ASSETS"

          package_macos_target() {
            local target="$1"
            local bin="${DIST}/${target}/bin/opencode"
            local out="${ASSETS}/${target}.zip"

            if [ ! -f "$bin" ]; then
              echo "Missing macOS binary: $bin" >&2
              exit 1
            fi

            chmod +x "$bin"

            # Ad-hoc signing prevents stale/broken signatures on downloaded CLI binaries.
            # #156：mac adhoc 签名降低 Gatekeeper 误杀
            codesign --force --sign - --timestamp=none "$bin"
            codesign --verify --verbose=4 "$bin"

            rm -f "$out"
            (
              cd "${DIST}/${target}/bin"
              # #156：系统 zip 保证跨 runner 一致：Compress-Archive 在 PS7 下才稳定
              zip -9 -q "${GITHUB_WORKSPACE}/${out}" opencode
            )

            echo "Created $out"
          }

          package_macos_target opencode-darwin-arm64
          package_macos_target opencode-darwin-x64

          ls -lah "$ASSETS"

      - name: Upload macOS workflow artifacts
        # #156：构建产物先 artifact，延迟统一上传
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            release-assets/opencode-darwin-arm64.zip
            release-assets/opencode-darwin-x64.zip

  # #156：Linux 需 dpkg-dev 打 deb：runner 预装但 apt 缓存可能失效，先显式安装
  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install Linux packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Build Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          cd packages/opencode
          bun run script/build.ts \
            --version=${{ needs.version.outputs.version }} \
            --os=linux \
            --skip-embed-web-ui

      - name: Package Linux assets
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.version.outputs.version }}"
          DIST="packages/opencode/dist"
          ASSETS="release-assets"
          mkdir -p "$ASSETS"

          package_linux_tarball() {
            local target="$1"
            local bin="${DIST}/${target}/bin/opencode"
            local out="${ASSETS}/${target}.tar.gz"

            if [ ! -f "$bin" ]; then
              echo "Skip missing Linux binary: $bin"
              return 0
            fi

            chmod +x "$bin"
            (
              cd "${DIST}/${target}/bin"
              # #156：资产名含 os/arch 是 install 候选探测契约，改名即断 404 回退链
              tar -czf "${GITHUB_WORKSPACE}/${out}" opencode
            )

            echo "Created $out"
          }

          package_linux_tarball opencode-linux-x64
          package_linux_tarball opencode-linux-arm64

          if [ ! -f "${ASSETS}/opencode-linux-x64.tar.gz" ]; then
            echo "Required Linux x64 asset was not created" >&2
            exit 1
          fi

          # Debian/Ubuntu package for amd64. This intentionally uses /usr/local/bin
          # to match the current manual binary install convention for this fork.
          DEB_ROOT="/tmp/opencode-deb"
          PKG_DIR="${DEB_ROOT}/opencode_${VERSION}_amd64"
          BINARY="${DIST}/opencode-linux-x64/bin/opencode"
          DEB_OUT="${ASSETS}/opencode_${VERSION}_amd64.deb"

          rm -rf "$DEB_ROOT"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/local/bin"

          install -m 0755 "$BINARY" "${PKG_DIR}/usr/local/bin/opencode"

          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: opencode
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: smark <smark@local>
          Description: opencode AI-powered development tool (smark build)
           A standalone AI coding assistant with TUI, version ${VERSION}.
          EOF

          # dpkg control files must not contain leading indentation.
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/control"

          # #156：deb 打包；control 禁止 leading indent
          dpkg-deb --build "$PKG_DIR" "$DEB_OUT"

          ls -lah "$ASSETS"

      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            release-assets/opencode-linux-x64.tar.gz
            release-assets/opencode-linux-arm64.tar.gz
            release-assets/opencode_*_amd64.deb

  # #156：Windows x64 构建保留 MSVC 工具链
  build-windows:
    needs: version
    # #156：保留 node/python：sharp 等 native 模块在 Windows 构建时需 node-gyp 工具链
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: microsoft/setup-msbuild@v2

      # #170：Windows 跳过 setup-bun 多 GB cache restore/save，直装更快
      # #170：mac/linux 仍走共享 composite；仅 Windows 旁路
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Windows dependencies
        shell: pwsh
        env:
          # #170：跳过重型可选浏览器/桌面二进制下载
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          ELECTRON_SKIP_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_DOWNLOAD: "1"
          CYPRESS_INSTALL_BINARY: "0"
          # #170：非交互 CI 禁止 husky prepare 挂载
          HUSKY: "0"
        run: |
          $ErrorActionPreference = "Stop"
          # #170：缺 setuptools 时显式安装，失败 fail-closed
          python -c "import setuptools" 2>$null
          if ($LASTEXITCODE -ne 0) {
            python -m pip install --upgrade setuptools
          }
          bun install --linker hoisted

      - name: Build Windows x64 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd packages/opencode
          bun run script/build.ts --version=${{ needs.version.outputs.version }} --os=win32 --arch=x64 --skip-embed-web-ui

      - name: Package Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Dist = "packages/opencode/dist"
          $Source = Join-Path $Dist "opencode-windows-x64/bin/opencode.exe"
          $Assets = "release-assets"
          $Stage = Join-Path $env:RUNNER_TEMP "opencode-windows-x64"
          $ZipOut = Join-Path $Assets "opencode-windows-x64.zip"
          $ExeOut = Join-Path $Assets "opencode-windows-x64.exe"

          if (!(Test-Path $Source)) {
            throw "Missing Windows binary: $Source"
          }

          New-Item -ItemType Directory -Force -Path $Assets | Out-Null
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null

          # #156：裸 exe 与 zip 双资产：install 的 exe 直装分支按候选名探测
          Copy-Item $Source (Join-Path $Stage "opencode.exe") -Force
          Copy-Item $Source $ExeOut -Force

          if (Test-Path $ZipOut) {
            Remove-Item $ZipOut -Force
          }

          Compress-Archive -Path (Join-Path $Stage "opencode.exe") -DestinationPath $ZipOut -CompressionLevel Optimal

          Get-ChildItem $Assets | Format-Table Name, Length

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release-assets/opencode-windows-x64.zip
            release-assets/opencode-windows-x64.exe

  # #156：artifact 聚合 + checksums.txt + install 入 release
  checksums:
    needs:
      - version
      - build-macos
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes 需要完整 commit 历史 + 全部 tag

      - name: Download release workflow artifacts
        # #156：merge-multiple 平铺目录：免逐平台拼路径，find 可枚举全部资产
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Add install script and generate checksums
        shell: bash
        run: |
          set -euo pipefail

          # fail-closed：仓库缺 install 脚本时中止，不发布残缺资产
          if [ ! -f install ]; then
            echo "Missing repository install script at ./install" >&2
            exit 1
          fi

          # install 脚本与二进制同批发布：用户 curl 到的脚本与资产版本永远对齐
          cp install release-assets/install
          chmod +x release-assets/install

          cd release-assets

          echo "Release assets before checksums:"
          # #156：find 而非 glob：资产名含 os/arch 组合，新平台资产自动进 checksums
          find . -maxdepth 1 -type f -printf '%f\n' | sort

          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt

          echo "==== checksums.txt ===="
          cat checksums.txt

      - name: Generate release notes from commit log
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # 上一个版本 tag（排除当前版本自身；匹配 v*-smark 格式）
          PREV_TAG=$(git tag --sort=-creatordate \
            | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+(-smark)?$" \
            | grep -vE "^v${VERSION}$" \
            | head -1)

          {
            echo "## 更新内容"
            echo ""

            if [ -z "$PREV_TAG" ]; then
              echo "（首次发布）"
              git log --format="%h %s" --reverse | head -50
                # 首次发布无上界：head -50 防止全量历史撑爆 release body
            else
              # 版本 bump commit：首个把当前版本号写进 package.json 的提交
              BUMPCOMMIT=$(git log "${PREV_TAG}..HEAD" --reverse --format="%H" \
                -S "\"version\": \"${VERSION}\"" -- packages/opencode/package.json | head -1)
                # -S pickaxe 把检索限定在 package.json 首个引入该版本串的提交，避免误抓 changelog 同名文本

              if [ -n "$BUMPCOMMIT" ]; then
                # 有版本 bump：分两节，避免上个版本期间积累的 commit 与本版本新增混在一起
                POST_BUMP=$(git log "${BUMPCOMMIT}..HEAD" --format="%h %s" --reverse)
                if [ -n "$POST_BUMP" ]; then
                  echo "### v${VERSION} 新增"
                  echo ""
                  echo "$POST_BUMP"
                  echo ""
                fi

                ACCUMULATED=$(git log "${PREV_TAG}..${BUMPCOMMIT}" --format="%h %s" --reverse)
                if [ -n "$ACCUMULATED" ]; then
                  echo "### 自 \`${PREV_TAG}\` 积累"
                  echo ""
                  echo "$ACCUMULATED"
                  echo ""
                fi
              else
                # 无版本 bump（同版本重新 push 或手动覆盖版本号）：单节展示全部增量
                echo "自 \`${PREV_TAG}\` 以来的变更："
                echo ""
                git log "${PREV_TAG}..HEAD" --format="%h %s" --reverse
                echo ""
              fi
            fi

            echo "---"
            echo "自动构建 from ${{ github.sha }}"
          } > release-notes.md
            # 两分支输出统一经块重定向落盘，保证 release create/edit 读到完整 markdown

          echo "==== release-notes.md ===="
          cat release-notes.md

      - name: Create or update GitHub Release
        env:
          # #156：GITHUB_TOKEN 而非 PAT：同仓库 release 写入已授权且永不过期
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes and assets."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            # #156：release 创建下沉到 checksums，避免空 release
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets with retry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # #156：上传重试函数，瞬时 API 失败可恢复
          upload_with_retry() {
            local file="$1"
            # #156：上传重试上限，避免无限挂起
            local max_attempts=5
            local attempt=1

            while true; do
              echo "Uploading ${file} attempt ${attempt}/${max_attempts}"

              # #156：统一上传点：--clobber 幂等，重试不会产生 -1 后缀副本
              if gh release upload "$TAG" "$file" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber; then
                echo "Uploaded ${file}"
                return 0
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Failed to upload ${file} after ${max_attempts} attempts" >&2
                return 1
              fi

              # #156：15s×attempt 线性退避：release 上传 429 多为瞬时窗口，指数退避反而拉长失败反馈
              sleep $(( attempt * 15 ))
              attempt=$(( attempt + 1 ))
            done
          }

          cd release-assets

          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          echo "Uploading release assets:"
          printf '  %s\n' "${files[@]}"

          for file in "${files[@]}"; do
            upload_with_retry "$file"
          done
