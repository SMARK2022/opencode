# #104：版本从 packages/opencode/package.json 自动提取；GitHub Release 直传资产
name: Build OpenCode CLI

on:
  # #104：去掉 version input，避免与 package.json 双源
  workflow_dispatch:
  # push 自动触发：dev-smark + 路径过滤（含 setup-bun 变更）
  push:
    branches:
      - dev-smark
    paths:
      - ".github/workflows/build-opencode.yml"
      - "packages/opencode/**"
      # 原 CLI 产品已拆到这些运行时 owner，独立改动也须触发构建，避免仅旧目录命中而漏包
      - "packages/core/**"
      - "packages/tui/**"
      - "packages/llm/**"
      - "packages/schema/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "package.json"
      - "bun.lock"
      # #104：setup-bun 变更必须触发重建，避免工具链静默陈旧
      - ".github/actions/setup-bun/action.yml"

jobs:
  # #104：唯一版本源 = packages/opencode/package.json，读失败 fail-closed
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pkg
        shell: bash
        run: |
          set -euo pipefail
          # #104：node 同步读 package.json.version，禁止默认常量回退
          VERSION="$(node -p "require('./packages/opencode/package.json').version")"
          # #104：空/undefined 立即失败，避免错误 tag 静默发布
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "Failed to read packages/opencode/package.json version" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # #104：若不存在对应 tag 的 release 则创建
  ensure-release:
    runs-on: ubuntu-latest
    needs: [version]
    permissions:
      contents: write
    steps:
      - name: Ensure GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            # #104：新建 release 锚定当前 SHA
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "OpenCode smark build $VERSION"
          fi

  # Linux：tar.gz + deb → release
  build-linux:
    runs-on: ubuntu-latest
    needs: [version, ensure-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # setup-bun 从根 packageManager 取 Bun 版本，并保留缓存及 Windows hoisted 安装分支
      - uses: ./.github/actions/setup-bun

      # build.ts 会清空 dist，三平台在各自 runner 执行构建，不能共享同一构建目录
      - name: Build Linux
        run: |
          cd packages/opencode
          # --skip-embed-web-ui 同时排除文件映射与 UI entrypoint，沿用上游 CLI-only 构建入口
          # #104：--version 仅来自 package.json 解析结果
          bun run script/build.ts --version=${{ needs.version.outputs.version }} --os=linux --skip-embed-web-ui

      - name: Package Linux tar.gz
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cd packages/opencode/dist/opencode-linux-x64/bin
          # bin 位于 dist/<target>/bin，回退两级才与 upload-artifact 的 dist 路径一致
          # #103：相对 bin 的 ../../ 落到 dist/
          tar -czf ../../opencode-linux-x64-${VERSION}.tar.gz opencode

      - name: Package Linux .deb
        # YAML 自动剥离公共缩进，control/EOF 顶格；Description 续行仍多一空格。
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          DEB_DIR="/tmp/deb_build"
          PKG_NAME="opencode_${VERSION}_amd64"
          BINARY="packages/opencode/dist/opencode-linux-x64/bin/opencode"
          # 保留源包的 usr/local/bin 安装位置，control 必须放在包根的 DEBIAN 目录
          mkdir -p "${DEB_DIR}/${PKG_NAME}/DEBIAN"
          mkdir -p "${DEB_DIR}/${PKG_NAME}/usr/local/bin"
          cp "$BINARY" "${DEB_DIR}/${PKG_NAME}/usr/local/bin/opencode"
          # 复制后显式赋予执行位，避免归档或 runner 文件权限影响安装后的 CLI 启动
          chmod 755 "${DEB_DIR}/${PKG_NAME}/usr/local/bin/opencode"
          # Description 续行保留第十一空格，剥离公共缩进后仍是 Debian 必需的单空格续行
          # Linux deb 的 amd64 元数据只对应 x64 二进制，不能把 arm64 混入同一包
          cat > "${DEB_DIR}/${PKG_NAME}/DEBIAN/control" <<EOF
          Package: opencode
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: smark <smark@local>
          Description: opencode AI-powered development tool (smark build)
           A standalone AI coding assistant with TUI, version ${VERSION}.
          EOF
          dpkg-deb --build "${DEB_DIR}/${PKG_NAME}" "packages/opencode/dist/opencode_${VERSION}_amd64.deb"

      - name: Upload Linux assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # #104：gh release upload 替代 upload-artifact
          gh release upload "$TAG" \
            packages/opencode/dist/opencode-linux-x64-*.tar.gz \
            packages/opencode/dist/opencode_*_amd64.deb \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # #104：macOS 双架构 tar.gz 直传 release
  build-macos:
    runs-on: macos-latest
    needs: [version, ensure-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      - name: Build macOS
        run: |
          cd packages/opencode
          # --os=darwin 选择双架构而非 runner 本机架构，不能替换为 --single
          bun run script/build.ts --version=${{ needs.version.outputs.version }} --os=darwin --skip-embed-web-ui

      - name: Package macOS tar.gz
        run: |
          # VERSION shell 变量：统一两架构的命名，避免重复展开 GitHub 表达式
          VERSION="${{ needs.version.outputs.version }}"
          # darwin 目标名来自 build.ts，保持原生目录名以匹配两架构打包路径
          cd packages/opencode/dist/opencode-darwin-arm64/bin
          tar -czf ../../opencode-darwin-arm64-${VERSION}.tar.gz opencode
          cd ../../opencode-darwin-x64/bin
          tar -czf ../../opencode-darwin-x64-${VERSION}.tar.gz opencode

      - name: Upload macOS assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            packages/opencode/dist/opencode-darwin-arm64-*.tar.gz \
            packages/opencode/dist/opencode-darwin-x64-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # Windows x64：#103 arch；#104 裸 exe 上传 release
  build-windows:
    runs-on: windows-latest
    needs: [version, ensure-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # setup-bun 已提供 Node 24；Python 必须先就绪，供其安装阶段的 node-gyp 使用
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # MSBuild 先于 setup-bun 的依赖安装，保留 Windows 原生 addon 的编译工具链入口
      - uses: microsoft/setup-msbuild@v2
      - uses: ./.github/actions/setup-bun

      - name: Build Windows x64
        shell: pwsh
        run: |
          cd packages/opencode
          bun run script/build.ts --version=${{ needs.version.outputs.version }} --os=win32 --arch=x64 --skip-embed-web-ui

      - name: Package Windows x64 exe
        shell: pwsh
        run: |
          # #104：发布裸 exe（相对 zip）
          $VERSION = "${{ needs.version.outputs.version }}"
          Copy-Item "packages/opencode/dist/opencode-windows-x64/bin/opencode.exe" "packages/opencode/dist/opencode-windows-x64-$VERSION.exe" -Force

      - name: Upload Windows assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem "packages/opencode/dist/opencode-windows-x64-*.exe" -ErrorAction Stop)
          if ($files.Count -eq 0) {
            # #104：无 exe 硬失败，禁止空 release
            throw "No Windows exe assets found"
          }
          foreach ($file in $files) {
            gh release upload $env:TAG $file.FullName --repo $env:GITHUB_REPOSITORY --clobber
          }
