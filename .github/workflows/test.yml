name: test
# 显式设置 run-name 为 commit 消息；GitHub Actions 默认 display_title 不再自动回退到 commit 消息
run-name: ${{ github.event.head_commit.message || github.workflow }}
# 1.x产品分支独立触发完整CI，迁移归档分支继续保留原用途。

on:
  push:
    branches:
      - dev1-smark
  pull_request:
    branches:
      - dev1-smark
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/dev1-smark' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true
# 产品分支保留每次运行，PR按编号取消旧运行；不改变既有矩阵执行语义。

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # CI 环境禁止 LSP server 自动下载：runner 预装 .NET SDK 时 CSharp/FSharp server
  # 会触发 dotnet tool install 下载 roslyn-language-server，耗时 >30s 导致 BOM
  # 测试（.cs 文件触发 CSharp server spawn）超时。所有有 auto-download 的
  # LSP server 均在 spawn 中检查此 flag。
  OPENCODE_DISABLE_LSP_DOWNLOAD: "true"

jobs:
  # #263：核心必过/上游警告的分层契约——只有 core/httpapi/vscode 挡合并，上游兼容性只出告警
  core-required:
    name: 必过核心测试 / ${{ matrix.label }} / ${{ matrix.os_label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # #263：fail-fast 关闭——一个 OS 失败不取消其余矩阵，保证单平台问题可独立定位
        include:
          - id: opencode-linux
            label: packages/opencode
            os_label: Linux
            runner: ubuntu-latest
            command: GITHUB_ACTIONS=false bun turbo test:ci --filter=opencode --continue=dependencies-successful --log-order=stream
            # opencode 分片产出 junit-core.xml 与 junit-tui.xml——消费侧一律 glob 拾取。
            junit: packages/opencode/.artifacts/unit/*.xml
          # 独立 runner 三分片，净增两个 Windows job；每片保留相同安装图与依赖构建。
          # 分片 env 纳入测试缓存键，报告路径逐片唯一，失败不能互相覆盖。
          - id: opencode-windows-integration
            label: packages/opencode
            os_label: Windows / 会话与服务集成
            runner: windows-latest
            command: GITHUB_ACTIONS=false OPENCODE_TEST_SHARD=integration bun turbo test:ci --filter=opencode --continue=dependencies-successful --log-order=stream
            junit: packages/opencode/.artifacts/unit/junit-integration.xml
          - id: opencode-windows-runtime
            label: packages/opencode
            os_label: Windows / 工具与基础模块
            runner: windows-latest
            command: GITHUB_ACTIONS=false OPENCODE_TEST_SHARD=runtime bun turbo test:ci --filter=opencode --continue=dependencies-successful --log-order=stream
            junit: packages/opencode/.artifacts/unit/junit-runtime.xml
          - id: opencode-windows-tui
            label: packages/opencode
            os_label: Windows / TUI
            runner: windows-latest
            command: GITHUB_ACTIONS=false OPENCODE_TEST_SHARD=tui bun turbo test:ci --filter=opencode --continue=dependencies-successful --log-order=stream
            junit: packages/opencode/.artifacts/unit/junit-tui.xml
          - id: core-linux
            label: packages/core
            os_label: Linux
            runner: ubuntu-latest
            command: GITHUB_ACTIONS=false bun run --cwd packages/core test --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml
            junit: packages/core/.artifacts/unit/junit.xml
          - id: core-windows
            label: packages/core
            os_label: Windows
            runner: windows-latest
            command: GITHUB_ACTIONS=false bun run --cwd packages/core test --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml
            junit: packages/core/.artifacts/unit/junit.xml
          - id: http-recorder-linux
            label: packages/http-recorder
            os_label: Linux
            runner: ubuntu-latest
            command: GITHUB_ACTIONS=false bun run --cwd packages/http-recorder test --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml
            junit: packages/http-recorder/.artifacts/unit/junit.xml
          - id: http-recorder-windows
            label: packages/http-recorder
            os_label: Windows
            runner: windows-latest
            command: GITHUB_ACTIONS=false bun run --cwd packages/http-recorder test --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml
            junit: packages/http-recorder/.artifacts/unit/junit.xml
          # macOS 覆盖 opencode/core 的平台分支；http-recorder 保留既有双平台矩阵。
          # 与现有必过项使用相同 test/JUnit 契约，filewatcher 标志仍按 runner 判断。
          - id: opencode-macos
            label: packages/opencode
            os_label: macOS
            runner: macos-latest
            command: GITHUB_ACTIONS=false bun turbo test:ci --filter=opencode --continue=dependencies-successful --log-order=stream
            junit: packages/opencode/.artifacts/unit/*.xml
          - id: core-macos
            label: packages/core
            os_label: macOS
            runner: macos-latest
            command: GITHUB_ACTIONS=false bun run --cwd packages/core test --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml
            junit: packages/core/.artifacts/unit/junit.xml
          # 迁出的原生消费测试由TUI包自己的进程和preload承载，不漏出原全覆盖合同。
          - id: tui-linux
            label: packages/tui
            os_label: Linux
            runner: ubuntu-latest
            command: GITHUB_ACTIONS=false bun turbo test --filter=@opencode-ai/tui --continue=dependencies-successful -- --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml
            junit: packages/tui/.artifacts/unit/junit.xml
          - id: tui-windows
            label: packages/tui
            os_label: Windows
            runner: windows-latest
            command: GITHUB_ACTIONS=false bun turbo test --filter=@opencode-ai/tui --continue=dependencies-successful -- --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml
            junit: packages/tui/.artifacts/unit/junit.xml
          - id: tui-macos
            label: packages/tui
            os_label: macOS
            runner: macos-latest
            command: GITHUB_ACTIONS=false bun turbo test --filter=@opencode-ai/tui --continue=dependencies-successful -- --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml
            junit: packages/tui/.artifacts/unit/junit.xml
    defaults:
      run:
        shell: bash
    env:
      OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ matrix.runner == 'windows-latest' && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          # root 保留执行工具与 hooks；SDK 的 ^build 反向读取 CLI，安装图须覆盖其运行依赖。
          install-flags: --filter './' --filter './${{ matrix.label }}' --filter './packages/opencode'
          cache-scope: test-${{ matrix.label }}-opencode-root-v1

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run required package tests
        id: test
        # 预留 job 剩余时间上传证据；超时仍失败，不把收尾截止当作挂起修复。
        timeout-minutes: 45
        run: |
          # Bun reporter不创建父目录；保留矩阵原有的JUnit产物路径。
          mkdir -p "$(dirname "${{ matrix.junit }}")"
          mkdir -p "${{ matrix.label }}/.artifacts/ci"
          # 默认 bash 启用 pipefail；tee 不覆盖测试真实失败，日志不依赖 JUnit 完成。
          ${{ matrix.command }} 2>&1 | tee "${{ matrix.label }}/.artifacts/ci/test.log"

      - name: Check unit report
        id: junit
        if: always()
        run: |
          # 默认全量产出两个报告，Windows 单片产出一个；同一检查兼容 glob 与精确路径。
          if compgen -G "${{ matrix.junit }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish required unit report
        if: always() && steps.junit.outputs.exists == 'true'
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          report_paths: ${{ matrix.junit }}
          check_name: "必过核心测试结果 / ${{ matrix.label }} / ${{ matrix.os_label }}"
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload required unit artifact
        # child 未退出时可能没有 XML，仍保留已输出的 build/测试进展。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-unit-${{ matrix.id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ matrix.junit }}
            ${{ matrix.label }}/.artifacts/ci/test.log

      - name: Write required summary
        if: always()
        run: |
          case "${{ steps.test.outcome }}" in
            success) result="通过" ;;
            failure) result="失败" ;;
            cancelled) result="取消" ;;
            skipped) result="跳过" ;;
            *) result="${{ steps.test.outcome }}" ;;
          esac

          {
            echo "### 必过核心测试"
            echo "| 组件 | 平台 | 结果 | JUnit |"
            echo "| --- | --- | --- | --- |"
            echo "| ${{ matrix.label }} | ${{ matrix.os_label }} | ${result} | ${{ steps.junit.outputs.exists == 'true' && '已生成' || '未生成' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  core-stress-windows:
    name: 压力 Windows shell 捕获宿主
    runs-on: windows-latest
    # 10 分钟硬上限包含安装与测试：规模 500 次调用（内部超时 5 分钟）为弱机预留整个 setup 窗口。
    # 不设 continue-on-error：本分支是必过稳定性信号，健康时与核心套件同为绿标。
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # Checkout的SHA固定Action供应链版本；未设置ref，待测源码仍是当前事件的commit。
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --filter './' --filter './packages/core'
          cache-scope: test-packages/core-root-v1
      - name: Run shell capture host stress
        id: stress
        working-directory: packages/core
        env:
          OPENCODE_STRESS: "1"
          OPENCODE_STRESS_COUNT: "500" # 不按机器快慢减少样本，固定规模的每次执行都须完成。
          OPENCODE_STRESS_ROUNDS: "1"
        # 固定次数稳定性门槛：全部调用完成且父进程存活；只断言稳定性/正确性，不断言吞吐。
        run: bun test test/stress/windows-shell-output-stress.test.ts
      - name: Write stress summary
        if: always()
        run: |
          case "${{ steps.stress.outcome }}" in
            success) result="通过" ;;
            failure) result="失败" ;;
            cancelled) result="取消（触达 10 分钟上限）" ;;
            skipped) result="跳过" ;;
            *) result="${{ steps.stress.outcome }}" ;;
          esac
          {
            echo "### 压力 Windows shell 捕获宿主"
            echo "| 范围 | 结果 | 说明 |"
            echo "| --- | --- | --- |"
            echo "| 500 次 marked spawn | ${result} | 必过稳定性分支 |"
          } >> "$GITHUB_STEP_SUMMARY"

  opentui-required:
    # #489：consumer 回归与 typecheck 必须同一 job 执行，避免不同安装图互相掩盖 peer 漂移。
    # 版本名不写死：gate 钉住的是 user-visible seam 行为，OpenTUI 版本由 catalog 决策单独管理。
    # 构建声明从root catalog派生，checkout另采索引gitlink；不再维护随版本过期的手写清单。
    # 声明、实际安装及远端tag授权是不同证据；consumer回归不能互相冒充这些事实。
    name: 必过 OpenTUI consumer gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

        # 两个文件分别覆盖 DialogPrompt factory 渲染与 CJK 边界/布局宽度管线。
      - name: Run OpenTUI consumer regressions
        # Goal CJK 与 DialogPrompt factory 是用户可见 seam，回归必须随依赖升级一起跑。
        working-directory: packages/tui
        # tui 包内自有 bun test 配置（30s timeout），不在 workflow 层重复传参。
        run: bun test test/cli/tui/dialog-prompt.test.tsx test/routes/session/session-layout.test.ts

      - name: Typecheck Solid ecosystem consumers
        # 同一 Solid runtime 被多个 workspace 直接或间接消费，不能只验证 TUI 包本身。
        run: |
          # 任一 consumer typecheck 失败即整体失败：Solid peer 漂移会同时影响全部列表项。
          set -euo pipefail
          for package in packages/opencode packages/plugin packages/app packages/ui packages/enterprise packages/desktop packages/console/app packages/console/core packages/sdk/js packages/slack packages/tui; do
            bun run --cwd "$package" typecheck
          done

  httpapi-required:
    # #263：HttpApi gate 是 wire 契约的机器可校验入口——缺场景/跳过场景一律视为失败，
    name: 必过 HttpApi gate / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: coverage
            label: 路由覆盖
          - mode: auth
            label: 鉴权覆盖
          - mode: effect
            label: Effect 覆盖
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          # 三个 mode 共享 CLI 测试依赖图，不为路由检查安装桌面和文档工具。
          install-flags: --filter './' --filter './packages/opencode'
          cache-scope: test-packages/opencode-root-v1

      - name: Run HttpApi exerciser gate
        id: test
        working-directory: packages/opencode
        run: bun run script/httpapi-exercise.ts --mode ${{ matrix.mode }} --fail-on-missing --fail-on-skip

      - name: Write HttpApi summary
        if: always()
        run: |
          case "${{ steps.test.outcome }}" in
            success) result="通过" ;;
            failure) result="失败" ;;
            cancelled) result="取消" ;;
            skipped) result="跳过" ;;
            *) result="${{ steps.test.outcome }}" ;;
          esac

          {
            echo "### 必过 HttpApi gate"
            echo "| Gate | 说明 | 结果 |"
            echo "| --- | --- | --- |"
            echo "| ${{ matrix.mode }} | ${{ matrix.label }} | ${result} |"
          } >> "$GITHUB_STEP_SUMMARY"

  vscode-required:
    # #263：VSCode SDK 编译/打包必过——扩展市场的发布面不允许回归
    name: 必过 VSCode SDK 检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install VSCode SDK dependencies
        working-directory: sdks/vscode
        run: bun install

      - name: Compile VSCode SDK tests
        working-directory: sdks/vscode
        run: bun run compile-tests

      - name: Package VSCode SDK
        id: package
        working-directory: sdks/vscode
        run: bun run package

      - name: Write VSCode SDK summary
        if: always()
        run: |
          case "${{ steps.package.outcome }}" in
            success) result="通过" ;;
            failure) result="失败" ;;
            cancelled) result="取消" ;;
            skipped) result="跳过" ;;
            *) result="${{ steps.package.outcome }}" ;;
          esac

          {
            echo "### 必过 VSCode SDK 检查"
            echo "| 组件 | 检查内容 | 结果 |"
            echo "| --- | --- | --- |"
            echo "| sdks/vscode | compile-tests + package(check-types/lint/esbuild) | ${result} |"
          } >> "$GITHUB_STEP_SUMMARY"

  upstream-unit-warning:
    name: 警告 上游单元兼容性 / ${{ matrix.os_label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    continue-on-error: true
    # #263：continue-on-error 是警告语义的落点——job 失败仅标红不阻塞合并，与 core-required 形成对照
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: Linux
            runner: ubuntu-latest
          - os_label: Windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    env:
      OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ matrix.runner == 'windows-latest' && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run upstream unit compatibility tests
        id: upstream
        continue-on-error: true
        run: |
          # 所有现有test任务共用相同相对报告路径，各包目录先准备好。
          for package in packages/* packages/console/* packages/stats/*; do
            if [ -f "$package/package.json" ]; then mkdir -p "$package/.artifacts/unit"; fi
          done
          # 只去掉同平台必过项，目标新增包继续走test与原有^build链，不误裁成App/UI。
          # 单条串行命令保留真实退出码、JUnit和流式日志，安装图仍覆盖全部兼容消费者。
          GITHUB_ACTIONS=false bun turbo test --filter='!opencode' --filter='!@opencode-ai/core' --filter='!@opencode-ai/http-recorder' --filter='!@opencode-ai/tui' --continue=always --summarize --concurrency=1 --log-order=stream -- --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml

      - name: Warn on upstream unit failures
        if: always() && steps.upstream.outcome != 'success'
        run: echo "::warning title=上游单元兼容性::${{ matrix.os_label }} 上游单元测试存在失败；此结果只作为兼容性警告，不阻断 fork 核心测试。"

      - name: Publish upstream unit reports
        if: always() && hashFiles('packages/**/.artifacts/unit/*.xml') != ''
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          report_paths: packages/**/.artifacts/unit/*.xml
          check_name: "警告 上游单元兼容性 / ${{ matrix.os_label }}"
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload upstream unit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-unit-${{ matrix.os_label }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          # 两个独立shard报告均需上传，与发布端使用同一glob。
          path: packages/**/.artifacts/unit/*.xml

      - name: Write upstream unit summary
        if: always()
        run: |
          case "${{ steps.upstream.outcome }}" in
            success) result="通过" ;;
            failure) result="警告：存在失败" ;;
            cancelled) result="取消" ;;
            skipped) result="跳过" ;;
            *) result="${{ steps.upstream.outcome }}" ;;
          esac

          {
            echo "### 警告 上游单元兼容性"
            echo "| 范围 | 平台 | 结果 | 说明 |"
            echo "| --- | --- | --- | --- |"
            echo "| 其余包（OpenCode、Core、HTTP recorder、TUI由同平台必过job覆盖） | ${{ matrix.os_label }} | ${result} | 不阻断必过核心测试 |"
          } >> "$GITHUB_STEP_SUMMARY"

  upstream-extra-warning:
    name: 警告 上游额外包测试 / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    # #263：continue-on-error 是警告语义的落点——job 失败仅标红不阻塞合并，与 core-required 形成对照
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: llm
            label: packages/llm
            path: packages/llm
            target: ""
          - id: enterprise
            label: packages/enterprise
            path: packages/enterprise
            target: test
          - id: desktop
            label: packages/desktop
            path: packages/desktop
            target: src
          - id: console-core
            label: packages/console/core
            path: packages/console/core
            target: test
          - id: console-app
            label: packages/console/app
            path: packages/console/app
            target: test
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          # Console 测试经 resource 消费 root SST；保留 root 工具，不裁掉真实传递依赖。
          install-flags: --filter './' --filter './${{ matrix.path }}'
          cache-scope: test-${{ matrix.path }}-root-v1

      - name: Run upstream extra package tests
        id: upstream
        continue-on-error: true
        env:
          # llm 包的兼容性测试需要非空 key 走通 provider 初始化；其它 matrix 项不需要真实密钥。
          OPENAI_API_KEY: ${{ matrix.id == 'llm' && 'test-key' || '' }}
        run: |
          mkdir -p "${{ matrix.path }}/.artifacts/upstream"
          if [ -n "${{ matrix.target }}" ]; then
            bun test --cwd "${{ matrix.path }}" "${{ matrix.target }}" --timeout 30000 --reporter=junit --reporter-outfile=.artifacts/upstream/junit.xml
          else
            bun test --cwd "${{ matrix.path }}" --timeout 30000 --reporter=junit --reporter-outfile=.artifacts/upstream/junit.xml
          fi

      - name: Warn on upstream extra failures
        if: always() && steps.upstream.outcome != 'success'
        run: echo "::warning title=上游额外包测试::${{ matrix.label }} 存在失败；此结果只作为兼容性警告，不阻断 fork 核心测试。"

      - name: Check upstream extra report
        id: junit
        if: always()
        run: |
          if [ -f "${{ matrix.path }}/.artifacts/upstream/junit.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish upstream extra report
        if: always() && steps.junit.outputs.exists == 'true'
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          report_paths: ${{ matrix.path }}/.artifacts/upstream/junit.xml
          check_name: "警告 上游额外包测试 / ${{ matrix.label }}"
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload upstream extra artifact
        if: always() && steps.junit.outputs.exists == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-extra-${{ matrix.id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ matrix.path }}/.artifacts/upstream/junit.xml

      - name: Write upstream extra summary
        if: always()
        run: |
          case "${{ steps.upstream.outcome }}" in
            success) result="通过" ;;
            failure) result="警告：存在失败" ;;
            cancelled) result="取消" ;;
            skipped) result="跳过" ;;
            *) result="${{ steps.upstream.outcome }}" ;;
          esac

          {
            echo "### 警告 上游额外包测试"
            echo "| 组件 | 结果 | JUnit | 说明 |"
            echo "| --- | --- | --- | --- |"
            echo "| ${{ matrix.label }} | ${result} | ${{ steps.junit.outputs.exists == 'true' && '已生成' || '未生成' }} | 不阻断必过核心测试 |"
          } >> "$GITHUB_STEP_SUMMARY"

  upstream-e2e-warning:
    name: 警告 上游 App E2E / ${{ matrix.os_label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: true
    # #263：continue-on-error 是警告语义的落点——job 失败仅标红不阻塞合并，与 core-required 形成对照
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: Linux
            runner: ubuntu-latest
          - os_label: Windows
            runner: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          # 保留自动浏览器/开发服务器兼容检查，与 App/UI warning 复用同一安装图。
          install-flags: --filter './' --filter './packages/app' --filter './packages/opencode'
          cache-scope: test-app-cli-root-v1

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        # setup-bun 使用 hoisted 安装，显式走根 node_modules 的锁定 CLI，避免 bunx 重新解析到未修复的安装器。
        # Windows 上 Bun 执行 .bin shim 会重映射 bin metadata；Node 直接执行 CLI 不触发该边界。
        timeout-minutes: 10
        run: node ../../node_modules/playwright/cli.js install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        # 浏览器下载和解压发生在 E2E 测试前，独立超时可以防止 install 卡住占满整个 warning job。
        # 继续走锁定的 Node CLI，确保安装和测试阶段使用同一个 Playwright 入口。
        timeout-minutes: 15
        run: node ../../node_modules/playwright/cli.js install chromium

      - name: Run upstream app e2e tests
        id: e2e
        continue-on-error: true
        working-directory: packages/app
        # 不通过 package script 解析 playwright bin，避免 Windows Bun 再次触发 .bin metadata remap。
        run: node ../../node_modules/playwright/cli.js test
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT: e2e/junit-${{ matrix.os_label }}.xml
        timeout-minutes: 30

      - name: Warn on upstream e2e failures
        if: always() && steps.e2e.outcome != 'success'
        run: echo "::warning title=上游 App E2E::${{ matrix.os_label }} App E2E 存在失败；此结果只作为兼容性警告，不阻断 fork 核心测试。"

      - name: Check upstream e2e report
        id: junit
        if: always()
        run: |
          if [ -f "packages/app/e2e/junit-${{ matrix.os_label }}.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish upstream e2e report
        if: always() && steps.junit.outputs.exists == 'true'
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          report_paths: packages/app/e2e/junit-${{ matrix.os_label }}.xml
          check_name: "警告 上游 App E2E / ${{ matrix.os_label }}"
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload upstream e2e artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-playwright-${{ matrix.os_label }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/junit-*.xml
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report

      - name: Write upstream e2e summary
        if: always()
        run: |
          case "${{ steps.e2e.outcome }}" in
            success) result="通过" ;;
            failure) result="警告：存在失败" ;;
            cancelled) result="取消" ;;
            skipped) result="跳过" ;;
            *) result="${{ steps.e2e.outcome }}" ;;
          esac

          {
            echo "### 警告 上游 App E2E"
            echo "| 范围 | 平台 | 结果 | 说明 |"
            echo "| --- | --- | --- | --- |"
            echo "| packages/app Playwright | ${{ matrix.os_label }} | ${result} | 不阻断必过核心测试 |"
          } >> "$GITHUB_STEP_SUMMARY"
